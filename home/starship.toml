format = """
[](cyan)\
$username\
[](bg:blue fg:cyan)\
$directory\
[](fg:blue bg:bright-cyan)\
$git_branch\
$git_status\
[](fg:bright-cyan bg:purple)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:purple)\
$fill\
$time\n \
[\uf178](fg:bright-cyan) \
"""


# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:cyan fg:bright-yellow"
style_root = "bg:cyan"
format = '[준]($style)'
disabled = false

[fill]
style = "fg:overlay"
symbol = " "

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#9A348E"

[directory]
style = "bg:blue fg:yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[elixir]
symbol = " "
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:bright-cyan fg:black"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:bright-cyan fg:black"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#c4a7e7"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:bright-blue)]($style)'
