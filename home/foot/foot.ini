# -*- conf -*-
shell=/run/current-system/sw/bin/fish --login
font=JetBrainsMono Nerd Font:size=11
pad=6x6

[colors-dark]
background=2e3440

## Normal/regular colors (color palette 0-7)
regular0=3b4252  # black
regular1=bf616a  # red
regular2=a3be8c  # green
regular3=ebcb8b  # yellow
regular4=81a1c1  # blue
regular5=b48ead  # magenta
regular6=88c0d0  # cyan
regular7=e5e9f0  # white

## Bright colors (color palette 8-15)
bright0=4c566a  # black
bright1=bf616a  # red
bright2=a3be8c  # green
bright3=ebcb8b  # yellow
bright4=81a1c1  # blue
bright5=b48ead  # magenta
bright6=8fbcbb  # cyan
bright7=eceff4  # white

[key-bindings]
clipboard-copy=Control+c XF86Copy
clipboard-paste=Control+v XF86Paste
