# More option see https://github.com/DreamMaoMao/mango/wiki/
exec-once=swaybg -c '#2e3440' -m solid_color
exec-once=quickshell
exec-once=mpd
exec-once=foot


monitorrule=name:.*,width:1920,height:1080,refresh:60,x:0,y:0,scale:1

# Window effect
shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_position_x = 0
shadows_position_y = 0
border_radius=8
no_radius_when_single=0
focused_opacity=1
unfocused_opacity=1


# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=100
animation_duration_open=100
animation_duration_tag=100
animation_duration_close=100
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.52
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=6
gappiv=6
gappoh=6
gappov=6
borderpx=0

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile

# reload config
bind=SUPER,I,reload_config

# menu and terminal
bind=Ctrl,space,spawn,qs ipc call launcher toggle
bind=SUPER,Y,spawn,foot
bind=SUPER,O,spawn,brave

# screenshot
bind=SUPER,P,spawn,sh ~/scripts/screenshot.sh

# exit
bind=SUPER,m,quit
bind=SUPER,U,killclient,

# switch window focus
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# go to tag
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,1,spawn,qs ipc call workspace setWorkspace 1
bind=SUPER,2,spawn,qs ipc call workspace setWorkspace 2
bind=SUPER,3,spawn,qs ipc call workspace setWorkspace 3
bind=SUPER,4,spawn,qs ipc call workspace setWorkspace 4
bind=SUPER,5,spawn,qs ipc call workspace setWorkspace 5
bind=SUPER,6,spawn,qs ipc call workspace setWorkspace 6

# send to tag
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,1,spawn,qs ipc call workspace setWorkspace 1
bind=SUPER+SHIFT,2,spawn,qs ipc call workspace setWorkspace 2
bind=SUPER+SHIFT,3,spawn,qs ipc call workspace setWorkspace 3
bind=SUPER+SHIFT,4,spawn,qs ipc call workspace setWorkspace 4
bind=SUPER+SHIFT,5,spawn,qs ipc call workspace setWorkspace 5
bind=SUPER+SHIFT,6,spawn,qs ipc call workspace setWorkspace 6
